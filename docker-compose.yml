services:
  postgres:
    image: postgres:16-alpine
    container_name: cashier-postgres
    environment:
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier
      POSTGRES_DB: cashier
    ports:
      - "5434:5432"
    volumes:
      - cashier-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cashier-postgres-data:
